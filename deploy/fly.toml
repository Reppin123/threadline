# Fly.io: single machine + 1 GB volume. From the repo root:
#   fly launch --no-deploy --copy-config --config deploy/fly.toml --name <app>
#   fly volumes create threadline_data --size 1 --region iad --config deploy/fly.toml
#   fly secrets set AUTH_SECRET=... ANTHROPIC_API_KEY=... SPECTRUM_PROJECT_ID=... SPECTRUM_PROJECT_SECRET=... APP_URL=https://<app>.fly.dev --config deploy/fly.toml
#   fly deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile
app = "threadline"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 70

[build]
  dockerfile = "Dockerfile"

[env]
  THREADLINE_DB = "/data/threadline.db"
  GATEWAY_MODE = "cloud"
  NODE_ENV = "production"

[mounts]
  source = "threadline_data"
  destination = "/data"

# Web on 443/80. SQLite on a volume ⇒ exactly one machine, never auto-stopped.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

# Gateway webhook (only needed with GATEWAY_INGEST=webhook): https://<app>.fly.dev:8443/spectrum/webhook
[[services]]
  internal_port = 3100
  protocol = "tcp"
  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
